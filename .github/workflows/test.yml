name: Validate GIF tools

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'full' || 'smoke' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  # Fast gate on every push/PR to main: Linux unit tests. Cases that need a
  # live FFmpeg/ffprobe runtime are skipped rather than errored.
  smoke:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Unit smoke (skip tests that need a live FFmpeg runtime)
        run: python scripts/run_ci_smoke.py

  # Full suite with the media runtime: run manually before a release
  # (Actions → Validate GIF tools → Run workflow).
  full:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements.txt
      - name: Install / verify media runtime
        run: |
          python scripts/media_runtime.py --install | tee /tmp/media-runtime.json
          python -c 'import json; p=json.load(open("/tmp/media-runtime.json")); print("VIDEO_GIF_FFMPEG="+p["ffmpeg"]); print("VIDEO_GIF_FFPROBE="+p["ffprobe"])' >> "$GITHUB_ENV"
      - name: Full test suite
        run: |
          mkdir -p .scratch
          python -m unittest discover -s tests -v
