[project]
name = "video-gif-studio"
version = "1.0.0"
description = "Local CLI and skill that turns existing video into transparent GIFs, APNGs, MP4s or sprite sheets."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "Pillow>=10",
  "numpy>=1.24",
  "opencv-python>=4.8",
  "static-ffmpeg==3.0",
]
